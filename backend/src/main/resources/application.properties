# ----------------------------------------
# 1. 서버 설정 (Server Configuration)
# ----------------------------------------
server.port=8080
server.servlet.context-path=/
# UTF-8 강제 설정 (인코딩 깨짐 방지에 도움)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request-encoding=true
server.servlet.encoding.force-response-encoding=true


# ----------------------------------------
# 2. H2 데이터베이스 설정 (H2 Database)
# ----------------------------------------
# 콘솔 활성화 (개발 중 DB 접속 확인용)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 데이터 소스 설정 (H2 인메모리 DB)
spring.datasource.url=jdbc:h2:mem:tutorialdb;MODE=MySQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ----------------------------------------
# 3. JPA/Hibernate 설정
# ----------------------------------------
# 사용할 데이터베이스 방언 (H2가 MySQL을 흉내 내도록 설정)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DB 스키마 생성 및 업데이트 전략
# 'create' : 애플리케이션 시작 시 기존 테이블 삭제 후 새로 생성 (개발 단계에서 사용)
# 'update' : 변경된 내용만 반영 (운영 시 주의)
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------
# 4. JWT 설정 (JWT Configuration)
# ----------------------------------------
# 💡 Base64 인코딩된 32바이트 이상의 시크릿 키를 사용합니다.
# 이 키는 토큰 생성 및 검증에 모두 사용됩니다.
jwt.secret=S3R3S1k5cFt2Y0JjQnE0YzdNckd2dEcxR2g3VDRyYTVXZTliVzJ2RjFwVjZkM0d1T2l5UjdjMXJjYTRhVDB5bA==

# 💡 JWT 만료 시간 (예: 1시간 = 60분 * 60초 * 1000ms = 3,600,000)
jwt.expiration=3600

# application.properties ??? ?? (?? ??)
spring.mandatory-file-encoding=UTF-8

logging.level.org.springframework.security=DEBUG